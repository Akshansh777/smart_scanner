name: smart_scanner
description: Smart Document Scanner - AI-Powered on-device document management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # AI Integration
  google_generative_ai: ^0.4.7

  # Local Storage
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.2.0
  path_provider: ^2.1.6
  simplest_document_scanner: ^1.0.1

  # UI
  flutter_markdown: ^0.7.1
  intl: ^0.19.0
  uuid: ^4.3.3

  # Document Scanner
  google_mlkit_document_scanner: ^0.4.1
  google_mlkit_text_recognition: ^0.16.0
  syncfusion_flutter_pdfviewer: ^32.2.9
  pdf: ^3.10.8
  printing: ^5.13.1
  share_plus: ^12.0.2
  image_picker: ^1.2.4
  http: ^1.6.0
  cunning_document_scanner: ^3.0.4
  path: ^1.9.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/image/hutao.jpeg
