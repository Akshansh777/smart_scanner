name: smart_scanner
description: Smart Document Scanner - AI-Powered on-device document management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  
  # AI Integration
  google_generative_ai: ^0.4.7
  
  # Local Persistence & Path Handling
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.2.0
  path_provider: ^2.1.2
  
  # UI & Markdown Display
  flutter_markdown: ^0.7.1
  intl: ^0.19.0
  uuid: ^4.3.3

  # Plugins for Member 2 & Member 3 to activate
  google_mlkit_document_scanner: ^0.2.0
  google_mlkit_text_recognition: ^0.13.0
  syncfusion_flutter_pdfviewer: ^25.2.7
  pdf: ^3.10.8
  printing: ^5.13.1
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0